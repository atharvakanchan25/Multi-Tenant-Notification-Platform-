global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
    # Relabel so every metric carries the service name
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
